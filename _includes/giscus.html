{% if site.giscus.repo_id != "" and site.giscus.category_id != "" %}
<!-- COMMENTS (Giscus, GitHub Discussions) -->
<section class="bg-c4{% if include.closing_wave %} position-relative overflow-hidden{% endif %}" data-kbd-stop>
  <div class="container post-comments-outer" data-reveal>
    <h2 class="fs-24 fw-semibold text-c0 mb-4">Comments</h2>
    <script src="https://giscus.app/client.js"
      data-repo="{{ site.giscus.repo }}"
      data-repo-id="{{ site.giscus.repo_id }}"
      data-category="{{ site.giscus.category }}"
      data-category-id="{{ site.giscus.category_id }}"
      data-mapping="pathname"
      data-strict="0"
      data-reactions-enabled="1"
      data-emit-metadata="0"
      data-input-position="bottom"
      data-theme="noborder_light"
      data-lang="en"
      crossorigin="anonymous"
      async>
    </script>
  </div>
  {% if include.closing_wave %}
  <svg class="wave-divider wave-divider--48" viewBox="0 0 1440 100" preserveAspectRatio="none">
    <path d="M0,50 C240,0 480,90 720,45 C960,5 1200,85 1440,40 L1440,100 L0,100 Z" class="fill-c0"></path>
  </svg>
  {% endif %}
</section>
{% endif %}
