title: N. E. Karantanis
description: "Portfolio and blog of N. E. Karantanis, PhD — education leadership, CV, and writing."
lang: en
url: "https://nekarantanis.co.uk"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

permalink: /blog/:slug.html

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: feed.xml

collections:
  posts:
    output: true
  publications:
    output: true
    permalink: /publications/:slug.html

defaults:
  - scope:
      path: ""
    values:
      base: ""
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      base: "../"
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
      base: "../"

# Giscus (GitHub Discussions-powered comments) — shown only on blog posts and
# publications, via _includes/giscus.html, gated on repo_id/category_id both
# being set. repo_id is this repo's own GraphQL node ID (stable, safe to commit).
# category/category_id come from giscus.app's configurator once Discussions is
# enabled on the repo and a category exists — see docs/reference.md.
giscus:
  repo: "Eneekay/nekarantanis"
  repo_id: "R_kgDOTUQNTw"
  category: ""
  category_id: ""

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
