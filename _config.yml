title: N. E. Karantanis
description: "Portfolio and blog of N. E. Karantanis, PhD — education leadership, CV, and writing."
lang: en
url: "https://nekarantanis.co.uk"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

permalink: /blog/:slug.html

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: feed.xml

collections:
  posts:
    output: true
  publications:
    output: true
    permalink: /publications/:slug.html

defaults:
  - scope:
      path: ""
    values:
      base: ""
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      base: "../"
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
      base: "../"

# Cusdis (lightweight, privacy-friendly comments) — shown only on blog posts
# and publications, via _includes/cusdis.html, gated on app_id being set.
# app_id comes from creating a site at cusdis.com (or a self-hosted instance)
# — see docs/reference.md.
cusdis:
  host: "https://cusdis.com"
  app_id: ""

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
