title: N. E. Karantanis
description: "Portfolio and blog of N. E. Karantanis, PhD — education leadership, CV, and writing."
lang: en
url: "https://nekarantanis.co.uk"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

permalink: /blog/:slug.html

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: feed.xml

collections:
  posts:
    output: true
  publications:
    output: true
    permalink: /publications/:slug.html

defaults:
  - scope:
      path: ""
    values:
      base: ""
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      base: "../"
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
      base: "../"

# Cusdis (lightweight, privacy-friendly comments) — shown only on blog posts
# and publications, via _includes/cusdis.html, gated on app_id being set.
# app_id comes from creating a site at cusdis.com (or a self-hosted instance)
# — see docs/reference.md.
cusdis:
  host: "https://cusdis.com"
  app_id: "5d5bc9bd-5348-42b7-be02-e58b21c58abd"

# Blog post read counts, shown next to the reading-time estimate in
# _layouts/post.html. worker_url points at the umami-pageviews-proxy
# Cloudflare Worker (a separate small deploy, not part of this repo - see
# docs/reference.md) which reads Umami pageview data server-side, since
# Umami's private API key can't safely live in client-side JS. Empty until
# that Worker is deployed and its URL is known - the "Reads" element isn't
# even added to the page until this is set.
pageviews:
  worker_url: ""

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
